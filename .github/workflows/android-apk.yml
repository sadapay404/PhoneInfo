# Builds the Android debug APK. Runs only when started by hand (Actions tab, or
# `gh workflow run android-apk.yml`), so it does not use Actions minutes on every push.
# Uses only what is in the repo (the sample catalog). The full personal catalog is never
# built here, because this repository is public and build artifacts are downloadable.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [arena/af213546-phoneinfo]   # TEMPORARY: remove after this build

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the web app
        run: npm run build

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # The GitHub Ubuntu image ships the Android SDK and accepts its licences (ANDROID_HOME).
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: aetherphone-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
