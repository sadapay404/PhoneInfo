<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AetherPhone Saver</title>
<style>
  body { width: 340px; margin: 0; font: 14px system-ui, sans-serif; color: #111; }
  header { padding: 12px 14px; border-bottom: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; }
  header strong { font-size: 15px; }
  ul { list-style: none; margin: 0; padding: 0; max-height: 340px; overflow: auto; }
  li { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 14px; border-bottom: 1px solid #f1f2f4; }
  li img { width: 44px; height: 44px; object-fit: contain; border-radius: 6px; background: #f3f4f6; }
  li .ph { width: 44px; height: 44px; border-radius: 6px; background: #f3f4f6; }
  li small { color: #6b7280; display: block; }
  button { font: inherit; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; padding: 5px 9px; cursor: pointer; }
  button.primary { background: #2f5bea; border-color: #2f5bea; color: #fff; }
  footer { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid #e5e7eb; }
  .empty { display: block; padding: 18px 14px; color: #6b7280; }
</style>
</head>
<body>
<header><strong>AetherPhone Saver</strong><span id="count" style="color:#6b7280"></span></header>
<ul id="list"></ul>
<footer>
  <button class="primary" id="export">Export ZIP</button>
  <button id="clear">Delete all</button>
</footer>
<script src="zip.js"></script>
<script src="popup.js"></script>
</body>
</html>
